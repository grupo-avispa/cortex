name: Build

on:
  push:
    branches: [development]

jobs:
  ubuntu-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: |
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            libasio-dev \
            libeigen3-dev \
            libopencv-dev \
            libopenscenegraph-dev \
            libqglviewer-dev-qt5 \
            libtinyxml2-dev \
            python3-dev \
            python3-pybind11 \
            qtbase5-dev \
            dpkg-dev
      - name: Dependencies
        run: bash ./dependencies.sh
        shell: bash
      - name: Restore build cache
        uses: actions/cache@v4.2.0
        id: restore-build
        with:
          path: ${{ github.workspace }}/build
          key: build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.sha }}
            build-${{ runner.os }}
      - name: Build project
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: ${{ github.workspace }}/build
      - name: Clean CMake files
        run: |
          echo "Cleaning CMake files from build directory..."
          find ${{ github.workspace }}/build -type f \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name 'CMakeFiles' -o -name 'Makefile' -o -name 'cmake_install.cmake' -o -name 'CMakeCache.txt' \) -delete
        shell: bash
      - name: Create DEB package
        run: |
          PACKAGE_NAME=$(basename ${{ github.repository }})
          PACKAGE_VERSION=1.0.0
          mkdir -p ${{ github.workspace }}/package/DEBIAN
          echo "Package: $PACKAGE_NAME" > ${{ github.workspace }}/package/DEBIAN/control
          echo "Version: $PACKAGE_VERSION" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Section: base" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Priority: optional" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Architecture: amd64" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Maintainer: Alberto Tudela <ajtudela@gmail.com>" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Description: Deep State Representation (DSR)" >> ${{ github.workspace }}/package/DEBIAN/control
          echo "Copyright: 2025 Alberto Tudela" >> ${{ github.workspace }}/package/DEBIAN/copyright
          mkdir -p ${{ github.workspace }}/package/usr/local/bin
          cp -r ${{ github.workspace }}/build ${{ github.workspace }}/package/usr/local/bin/
          dpkg-deb --build ${{ github.workspace }}/package ${{ github.workspace }}/${PACKAGE_NAME}_${PACKAGE_VERSION}.deb
        shell: bash
      - name: Install DEB package
        run: |
          sudo dpkg -i ${{ github.workspace }}/${{ env.PACKAGE_NAME }}_${{ env.PACKAGE_VERSION }}.deb
        shell: bash
      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}_${{ env.PACKAGE_VERSION }}.deb
          path: ${{ github.workspace }}/${{ env.PACKAGE_NAME }}_${{ env.PACKAGE_VERSION }}.deb
